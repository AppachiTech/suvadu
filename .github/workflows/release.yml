name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v0.1.0, v1.0.0

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos
            runner: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
            use_cross: false
            run_tests: true
            primary_release: true
          - os: macos
            runner: macos-latest
            target: x86_64-apple-darwin
            suffix: "-x86_64"
            use_cross: false
            run_tests: false
            primary_release: false
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
            use_cross: false
            run_tests: true
            primary_release: false
          - os: linux
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            suffix: "-aarch64"
            use_cross: true
            run_tests: false
            primary_release: false
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5

      - name: Run Tests
        if: matrix.run_tests
        run: cargo test

      - name: Build Binary (Release)
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Install minisign (macOS)
        if: matrix.os == 'macos'
        run: brew install minisign

      - name: Install minisign (Linux)
        if: matrix.os == 'linux'
        run: |
          curl -fsSL -o /tmp/minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.11/minisign-0.11-linux.tar.gz
          echo "f0a0954413df8531befed169e447a66da6868d79052ed7e892e50a4291af7ae0  /tmp/minisign.tar.gz" | sha256sum -c -
          tar xzf /tmp/minisign.tar.gz
          sudo cp minisign-linux/x86_64/minisign /usr/local/bin/
          rm -f /tmp/minisign.tar.gz

      - name: Prepare Artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Create directory structure for R2
          mkdir -p artifacts/${{ matrix.os }}/archive

          # Prepare binary
          cp target/${{ matrix.target }}/release/suv suv

          # Create main tarball (e.g. suv-macos-latest.tar.gz or suv-linux-aarch64-latest.tar.gz)
          tar -czf artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz suv LICENSE scripts/uninstall.sh

          # Generate SHA256 checksums
          if [ "${{ matrix.os }}" = "macos" ]; then
            shasum -a 256 artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz | awk '{print $1}' > artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.sha256
          else
            sha256sum artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz | awk '{print $1}' > artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.sha256
          fi

          # Sign with minisign (secret key from GitHub Secrets, empty password piped)
          echo "$MINISIGN_SECRET_KEY" > /tmp/minisign.key
          echo '' | minisign -S -s /tmp/minisign.key -m artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz \
            -t "suvadu ${{ github.ref_name }} ${{ matrix.os }}${{ matrix.suffix }}" -x artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.minisig
          rm -f /tmp/minisign.key

          # Write version.txt for install script version checks
          echo "${GITHUB_REF_NAME#v}" > artifacts/version.txt

          # Create versioned tarball
          cp artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz artifacts/${{ matrix.os }}/archive/suv-${{ matrix.os }}${{ matrix.suffix }}-${{ github.ref_name }}.tar.gz
          cp artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.sha256 artifacts/${{ matrix.os }}/archive/suv-${{ matrix.os }}${{ matrix.suffix }}-${{ github.ref_name }}.tar.gz.sha256
          cp artifacts/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.minisig artifacts/${{ matrix.os }}/archive/suv-${{ matrix.os }}${{ matrix.suffix }}-${{ github.ref_name }}.tar.gz.minisig

      - name: Upload to Cloudflare R2
        uses: ryand56/r2-upload-action@b801a390acbdeb034c5e684ff5e1361c06639e7c # v1.4
        with:
          r2-account-id: ${{ secrets.R2_ACCOUNT_ID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: ${{ secrets.R2_BUCKET }}
          source-dir: artifacts
          destination-dir: ./ # Destination prefix in bucket

      - name: Purge Cloudflare CDN Cache
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "files": [
                "https://downloads.appachi.tech/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz",
                "https://downloads.appachi.tech/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.sha256",
                "https://downloads.appachi.tech/${{ matrix.os }}/suv-${{ matrix.os }}${{ matrix.suffix }}-latest.tar.gz.minisig",
                "https://downloads.appachi.tech/version.txt"
              ]
            }'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          generate_release_notes: ${{ matrix.primary_release }}
          files: |
            artifacts/${{ matrix.os }}/archive/suv-${{ matrix.os }}${{ matrix.suffix }}-${{ github.ref_name }}.tar.gz
            artifacts/${{ matrix.os }}/archive/suv-${{ matrix.os }}${{ matrix.suffix }}-${{ github.ref_name }}.tar.gz.sha256
            artifacts/${{ matrix.os }}/archive/suv-${{ matrix.os }}${{ matrix.suffix }}-${{ github.ref_name }}.tar.gz.minisig

  update-homebrew-tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew Tap
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: AppachiTech/homebrew-suvadu
          token: ${{ secrets.GH_PAT }}
          path: homebrew-tap

      - name: Fetch checksums for all platforms
        run: |
          TAG=${{ github.ref_name }}
          BASE="https://downloads.appachi.tech"

          curl -fsSL "$BASE/macos/archive/suv-macos-${TAG}.tar.gz.sha256" -o macos_arm64.sha256
          curl -fsSL "$BASE/macos/archive/suv-macos-x86_64-${TAG}.tar.gz.sha256" -o macos_x86_64.sha256
          curl -fsSL "$BASE/linux/archive/suv-linux-${TAG}.tar.gz.sha256" -o linux_x86_64.sha256
          curl -fsSL "$BASE/linux/archive/suv-linux-aarch64-${TAG}.tar.gz.sha256" -o linux_aarch64.sha256

      - name: Update Homebrew Formula
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}

          MACOS_ARM64_SHA=$(cat macos_arm64.sha256)
          MACOS_X86_64_SHA=$(cat macos_x86_64.sha256)
          LINUX_X86_64_SHA=$(cat linux_x86_64.sha256)
          LINUX_AARCH64_SHA=$(cat linux_aarch64.sha256)

          FORMULA_PATH="homebrew-tap/Formula/suvadu.rb"

          cat > "$FORMULA_PATH" <<EOF
          class Suvadu < Formula
            desc "Total recall for your terminal."
            homepage "https://www.appachi.tech/suvadu/"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://downloads.appachi.tech/macos/archive/suv-macos-${TAG}.tar.gz"
                sha256 "${MACOS_ARM64_SHA}"
              else
                url "https://downloads.appachi.tech/macos/archive/suv-macos-x86_64-${TAG}.tar.gz"
                sha256 "${MACOS_X86_64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://downloads.appachi.tech/linux/archive/suv-linux-aarch64-${TAG}.tar.gz"
                sha256 "${LINUX_AARCH64_SHA}"
              else
                url "https://downloads.appachi.tech/linux/archive/suv-linux-${TAG}.tar.gz"
                sha256 "${LINUX_X86_64_SHA}"
              end
            end

            def install
              bin.install "suv"
              bin.install_symlink bin/"suv" => "suvadu"
              prefix.install "LICENSE"
            end

            def caveats
              <<~EOS
                To start recording history, add this to your .zshrc:
                  eval "\$(suv init zsh)"
              EOS
            end

            test do
              assert_match "suvadu", shell_output("#{bin}/suv --version")
            end
          end
          EOF

      - name: Commit and Push
        run: |
          cd homebrew-tap
          git config user.name "Appachi Bot"
          git config user.email "bot@appachi.tech"
          git add Formula/suvadu.rb
          git commit -m "Update suvadu to ${{ github.ref_name }}"
          git push
